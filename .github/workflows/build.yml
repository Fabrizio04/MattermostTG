name: Cross-Platform Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-cursor0 libxcb-util1 libx11-xcb1 dbus

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 websockets requests keyring pyinstaller

    - name: Build Executable (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconsole --onefile --add-data "img;img" --icon="img/icon_active.ico" --name="MattermostNotifier-Win" mattermost_notifier.py

    - name: Build Executable (Linux)
      if: runner.os == 'Linux'
      run: |
        pyinstaller --noconsole --onefile --add-data "img:img" --name="MattermostNotifier-Linux" mattermost_notifier.py

    - name: Build Executable (macOS)
      if: runner.os == 'macOS'
      run: |
        pyinstaller --noconsole --onefile --add-data "img:img" --name="MattermostNotifier-macOS" mattermost_notifier.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MattermostNotifier-${{ runner.os }}
        path: dist/MattermostNotifier*

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/MattermostNotifier*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}