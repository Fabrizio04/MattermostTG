name: Build Executable

on:
  push:
    branches: [ main ]
    tags:
      - 'v*' # Si attiva quando crei un tag tipo v1.0.0
  workflow_dispatch: # Ti permette di lanciarlo manualmente da GitHub

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 websockets requests keyring pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --add-data "img;img" --icon="img/icon_active.ico" --name="MattermostNotifier" mattermost_notifier.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MattermostNotifier-Executable
        path: dist/MattermostNotifier.exe

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/MattermostNotifier.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}