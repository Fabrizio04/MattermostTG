name: Cross-Platform Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-cursor0 libxcb-util1 libx11-xcb1 dbus xvfb libegl1 libgl1 libxkbcommon-x11-0

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 pytest pytest-qt websockets requests keyring keyrings.alt cryptography emoji pyinstaller

    - name: Run Tests (Linux)
      if: runner.os == 'Linux'
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python -m pytest

    - name: Run Tests (Windows & macOS)
      if: runner.os != 'Linux'
      run: |
        python -m pytest

    - name: Build Executable (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconsole --onefile --add-data "img;img" --add-data "web;web" --add-data "i18n;i18n" --icon="img/icon_active.ico" --name="MattermostNotifier-Win" mattermost_notifier.py

    - name: Build Executable (Linux)
      if: runner.os == 'Linux'
      run: |
        pyinstaller --noconsole --onefile --add-data "img:img" --add-data "web:web" --add-data "i18n:i18n" --name="MattermostNotifier-Linux" mattermost_notifier.py

    - name: Build Executable (macOS)
      if: runner.os == 'macOS'
      run: |
        pyinstaller --noconsole --onefile --add-data "img:img" --add-data "web:web" --add-data "i18n:i18n" --name="MattermostNotifier-macOS" mattermost_notifier.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MattermostNotifier-${{ runner.os }}
        path: dist/MattermostNotifier*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Download all workflow artifacts
      uses: actions/download-artifact@v4

    - name: Display structure of downloaded files
      run: ls -R

    - name: Package artifacts into zip files
      run: |
        # Creiamo gli archivi zip per ogni cartella di artifact scaricata
        cd MattermostNotifier-Windows && zip -r ../MattermostNotifier-Windows.zip * && cd ..
        cd MattermostNotifier-Linux && zip -r ../MattermostNotifier-Linux.zip * && cd ..
        cd MattermostNotifier-macOS && zip -r ../MattermostNotifier-macOS.zip * && cd ..
        ls -la

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          MattermostNotifier-Windows.zip
          MattermostNotifier-Linux.zip
          MattermostNotifier-macOS.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}